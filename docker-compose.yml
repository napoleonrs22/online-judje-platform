version: '3.8'

services:
  # Сервис для предварительного скачивания образов компиляторов (gcc, python и т.д.)
  images-init:
    image: docker:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./init-images.sh:/init-images.sh
    command: sh /init-images.sh
    restart: "no"

  db:
    image: postgres:14-alpine
    container_name: postgres_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  code-executor:
    build:
      context: ./go-executor
      dockerfile: Dockerfile
    container_name: go_judger
    env_file:
      - .env
    volumes:
      # Доступ к Docker демону
      - /var/run/docker.sock:/var/run/docker.sock
      # ВАЖНО: Монтируем текущую папку проекта.
      # Путь Снаружи (${PWD}/judger_temp) = Путь Внутри.
      - ${PWD}/judger_temp:${PWD}/judger_temp
    ports:
      - "8001:8001"
    environment:
      # Передаем Go этот длинный путь, чтобы он знал, куда писать
      JUDGER_SHARED_DIR: ${PWD}/judger_temp
      PORT: 8001
    depends_on:
      images-init:
        condition: service_completed_successfully
    restart: always

  api:
    build:
      context: ./fastapi-backend
      dockerfile: Dockerfile
    container_name: fastapi_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      # Передаем переменные БД
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: db
      DB_PORT: 5432
      # Ссылка на Go сервис
      CODE_EXECUTION_URL: http://code-executor:8001/execute
    depends_on:
      db:
        condition: service_healthy
      code-executor:
        condition: service_started
    # Wait-for-it скрипт (inline)
    command: >
      /bin/sh -c "
        echo 'Ожидание доступности PostgreSQL...';
        while ! pg_isready -h db -p 5432 -U ${POSTGRES_USER}; do
          echo 'PostgreSQL еще недоступен. Ожидание 1 секунду...';
          sleep 1;
        done;
        echo 'PostgreSQL запущен. Запуск FastAPI...';
        exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "
    restart: always

volumes:
  pg_data: