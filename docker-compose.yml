services:
  # Pre-pull compiler/runtime images for the judger (no host script = no Windows CRLF issues)
  images-init:
    image: docker:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -ec
      - |
        echo "Checking Docker images..."
        for img in python:3.10-slim gcc:latest eclipse-temurin:17-jdk-alpine node:18-alpine; do
          if docker images -q "$$img" | grep -q .; then
            echo "Image $$img already present."
          else
            echo "Pulling $$img..."
            docker pull "$$img"
          fi
        done
        echo "All judger images ready."
    restart: "no"

  db:
    image: postgres:14-alpine
    container_name: postgres_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  code-executor:
    build:
      context: ./go-executor
      dockerfile: Dockerfile
    container_name: go_judger
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./judger_temp:/tmp/judger
    ports:
      - "8001:8001"
    environment:
      JUDGER_SHARED_DIR: /tmp/judger
      PORT: 8001
      # Резерв: абсолютный путь к папке judger_temp на машине с Docker, если bind не определился из /proc/mounts
      JUDGER_HOST_BIND_ROOT: ${JUDGER_HOST_BIND_ROOT:-}
    depends_on:
      images-init:
        condition: service_completed_successfully
    restart: always

  api:
    build:
      context: ./fastapi-backend
      dockerfile: Dockerfile
    container_name: fastapi_api
    volumes:
      # Подхватывать код с хоста вместе с --reload (иначе нужен rebuild после каждого изменения)
      - ./fastapi-backend:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: db
      DB_PORT: 5432
      CODE_EXECUTION_URL: http://code-executor:8001/execute
    depends_on:
      db:
        condition: service_healthy
      code-executor:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - |
        echo "Waiting for PostgreSQL..."
        until pg_isready -h db -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do
          echo "PostgreSQL not ready yet..."
          sleep 1
        done
        echo "PostgreSQL is up. Starting FastAPI..."
        exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: always

volumes:
  pg_data:
